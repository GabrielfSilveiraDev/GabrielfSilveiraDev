# Regenerates the dynamic images of the profile README (languages, streak, snake)
# inside this repository, so the profile does not depend on third-party servers
# being online. Static images (banner, typing text, stack icons) live in assets/.
name: Update profile cards

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.GH_USER }}&layout=compact&langs_count=6&hide=html,css&theme=tokyonight&hide_border=true
          path: assets/cards/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ env.GH_USER }}&layout=compact&langs_count=6&hide=html,css&theme=default&hide_border=true
          path: assets/cards/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ env.GH_USER }}&theme=tokyonight&hide_border=true
          path: assets/cards/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ env.GH_USER }}&theme=default&hide_border=true
          path: assets/cards/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ env.GH_USER }}
          outputs: |
            assets/cards/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7
            assets/cards/snake-light.svg?palette=github-light&color_snake=#3d59a1

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update profile cards"
          git push
